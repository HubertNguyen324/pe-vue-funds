<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Blog (Vue.js)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue.js CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Vue Router CDN -->
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <style>
        /* Custom styles for Inter font and smooth transitions */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Light gray background */
        }
        .transition-all {
            transition-property: all;
            transition-duration: 300ms;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Active link styling for Vue Router */
        .router-link-active {
            font-weight: bold;
            color: #bfdbfe; /* A lighter blue to indicate active */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="bg-gradient-to-r from-blue-600 to-purple-700 text-white p-6 shadow-lg rounded-b-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-4xl font-extrabold tracking-tight">
                <router-link to="/" class="hover:text-blue-200 transition-colors">My Awesome Blog</router-link>
            </h1>
            <nav>
                <ul class="flex space-x-6">
                    <li><router-link to="/" class="text-lg hover:text-blue-200 transition-colors">Home</router-link></li>
                    <li><a href="#" class="text-lg hover:text-blue-200 transition-colors">About</a></li>
                    <li><a href="#" class="text-lg hover:text-blue-200 transition-colors">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div id="app" class="min-h-screen flex flex-col"></div>

    <footer class="bg-gray-800 text-white p-6 mt-8 rounded-t-lg shadow-inner">
        <div class="container mx-auto text-center">
            <p>&copy; 2025 My Awesome Blog. All rights reserved.</p>
            <div class="flex justify-center space-x-4 mt-2">
                <a href="#" class="hover:text-  blue-400 transition-colors">Privacy Policy</a>
                <a href="#" class="hover:text-blue-400 transition-colors">Terms of Service</a>
            </div>
        </div>
    </footer>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
